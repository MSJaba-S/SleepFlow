name: SleepFlow
options:
  bundleIdPrefix: com.samir
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  useBaseInternationalization: false

packages:
  SleepCore:
    path: Packages/SleepCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: en
    ENABLE_PREVIEWS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO

targets:
  SleepFlow:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: SleepCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samir.SleepFlow
        PRODUCT_NAME: SleepFlow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SleepFlow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, da]
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSMicrophoneUsageDescription: "SleepFlow listens for snoring, coughing, sleep talking and movement while you sleep. The sound is analysed on your iPhone and never uploaded."
        NSAlarmKitUsageDescription: "SleepFlow schedules your wake-up alarm so it rings even when the phone is locked or in Silent mode."
        NSMotionUsageDescription: "SleepFlow uses the motion sensor to notice how you move during the night when the phone lies on the mattress."
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        ITSAppUsesNonExemptEncryption: false
        UIRequiredDeviceCapabilities: [arm64]

  SleepFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SleepFlowTests
    dependencies:
      - target: SleepFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samir.SleepFlowTests
        GENERATE_INFOPLIST_FILE: YES

  SleepFlowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/SleepFlowUITests
    dependencies:
      - target: SleepFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samir.SleepFlowUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SleepFlow

schemes:
  SleepFlow:
    build:
      targets:
        SleepFlow: all
        SleepFlowTests: [test]
        SleepFlowUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: SleepFlowTests
        - name: SleepFlowUITests
    archive:
      config: Release
