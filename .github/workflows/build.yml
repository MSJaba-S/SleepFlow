name: Byg SleepFlow

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "guide/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Søvnmotor (SleepCore) – tests
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Tidszonedata (til sommertids-tests)
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tzdata python3 > /dev/null

      - name: Kør SleepCore-tests
        run: |
          set -o pipefail
          swift --version
          swift test --package-path Packages/SleepCore 2>&1 | tee core-tests.log

      - name: Rapportér fejl
        if: failure()
        run: python3 ci/report-errors.py core-tests.log core-errors.txt || true

      - name: Gem log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-tests-log
          path: |
            core-tests.log
            core-errors.txt
          if-no-files-found: ignore
